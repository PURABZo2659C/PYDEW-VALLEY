name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (blank = v + APP/build/VERSION.txt)'
        required: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install --upgrade pip pygame numpy pytmx opencv-python pyinstaller pillow
      - name: Build Windows ZIP
        working-directory: APP
        run: |
          .\build.bat all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ver = (Get-Content build\VERSION.txt -Raw).Trim()
          $source = "dist\Pydew Valley [v$ver] Windows.zip"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Windows ZIP was not created: $source"
          }
          Copy-Item -LiteralPath $source -Destination "dist\Pydew-Valley-v$ver-windows.zip"
      - name: Upload Windows package
        uses: actions/upload-artifact@v6
        with:
          name: windows-package
          path: APP/dist/Pydew-Valley-v*-windows.zip
          if-no-files-found: error
          retention-days: 1

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install --upgrade pip pygame numpy pytmx opencv-python pyinstaller pillow
      - name: Build macOS ZIP
        working-directory: APP
        run: |
          set -euo pipefail
          python build/make_version_info.py
          python build/make_icon.py
          python build/fix_line_endings.py
          python -m PyInstaller --clean --noconfirm --workpath "$RUNNER_TEMP/pydew-valley-pyinstaller" PydewValley.spec
          VER=$(cat build/VERSION.txt)
          test -d "dist/PydewValley.app"
          (cd dist && zip -r "Pydew-Valley-v${VER}-macos.zip" "PydewValley.app")
      - name: Upload macOS package
        uses: actions/upload-artifact@v6
        with:
          name: macos-package
          path: APP/dist/Pydew-Valley-v*-macos.zip
          if-no-files-found: error
          retention-days: 1

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install --upgrade pip pygame numpy pytmx opencv-python pyinstaller pillow
      - name: Build Linux ZIP
        working-directory: APP
        run: |
          set -euo pipefail
          python build/make_version_info.py
          python build/make_icon.py
          python build/fix_line_endings.py
          python -m PyInstaller --clean --noconfirm --workpath "$RUNNER_TEMP/pydew-valley-pyinstaller" PydewValley.spec
          VER=$(cat build/VERSION.txt)
          test -f "dist/PydewValley"
          (cd dist && zip "Pydew-Valley-v${VER}-linux.zip" "PydewValley")
      - name: Smoke test (no sound card, like WSL)
        working-directory: APP
        run: env -u SDL_AUDIODRIVER ./dist/PydewValley --selftest
      - name: Upload Linux package
        uses: actions/upload-artifact@v6
        with:
          name: linux-package
          path: APP/dist/Pydew-Valley-v*-linux.zip
          if-no-files-found: error
          retention-days: 1

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
      - build-linux
    steps:
      - uses: actions/checkout@v6
      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.version }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          elif [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          else
            tag="v$(cat APP/build/VERSION.txt)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Download Windows package
        uses: actions/download-artifact@v7
        with:
          name: windows-package
          path: release-assets
      - name: Download macOS package
        uses: actions/download-artifact@v7
        with:
          name: macos-package
          path: release-assets
      - name: Download Linux package
        uses: actions/download-artifact@v7
        with:
          name: linux-package
          path: release-assets
      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Updating release $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Pydew Valley $RELEASE_TAG" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
