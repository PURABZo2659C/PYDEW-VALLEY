name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.6)'
        required: true
        default: 'v2.6'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install --upgrade pip pygame numpy pytmx opencv-python pyinstaller
      - name: Build Windows
        working-directory: APP
        run: build.bat all
      - name: Create or find release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = Get-Content build\VERSION.txt
          $tag = "${{ github.event.inputs.version }}"
          if (-not $tag -or $tag -eq "") { $tag = $ver }
          $rel = gh release view $tag --json id 2>$null
          if (-not $rel) {
            gh release create $tag --name "Pydew Valley $tag" --generate-notes
          }
          echo "TAG=$tag" >> $env:GITHUB_ENV
      - name: Upload Windows asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ver = Get-Content build\VERSION.txt
          $tag = "${{ env.TAG }}"
          gh release upload $tag "APP/dist/Pydew Valley [v$ver] Windows.zip" --clobber

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install --upgrade pip pygame numpy pytmx opencv-python pyinstaller
      - name: Build macOS app bundle
        working-directory: APP
        run: |
          python build/make_version_info.py
          python build/make_icon.py
          python build/fix_line_endings.py
          python -m PyInstaller --clean --noconfirm PydewValley.spec
          VER=$(cat build/VERSION.txt)
          if [ -d "dist/PydewValley.app" ]; then
            zip -r "Pydew Valley [v$VER] macOS.zip" "dist/PydewValley.app"
          fi
      - name: Create or find release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(cat build/VERSION.txt)
          TAG="${{ github.event.inputs.version }}"
          if [ -z "$TAG" ]; then TAG=$VER; fi
          if ! gh release view $TAG --json id >/dev/null 2>&1; then
            gh release create $TAG --name "Pydew Valley $TAG" --generate-notes
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
      - name: Upload macOS asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(cat build/VERSION.txt)
          TAG="${{ env.TAG }}"
          gh release upload $TAG "APP/dist/Pydew Valley [v$VER] macOS.zip" --clobber

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev && pip install --upgrade pip pygame numpy pytmx opencv-python pyinstaller
      - name: Build Linux app dir
        working-directory: APP
        run: |
          python build/make_version_info.py
          python build/make_icon.py
          python build/fix_line_endings.py
          python -m PyInstaller --clean --noconfirm PydewValley.spec
          VER=$(cat build/VERSION.txt)
          if [ -d "dist/PydewValley" ]; then
            zip -r "Pydew Valley [v$VER] Linux.zip" "dist/PydewValley"
          fi
      - name: Create or find release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(cat build/VERSION.txt)
          TAG="${{ github.event.inputs.version }}"
          if [ -z "$TAG" ]; then TAG=$VER; fi
          if ! gh release view $TAG --json id >/dev/null 2>&1; then
            gh release create $TAG --name "Pydew Valley $TAG" --generate-notes
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
      - name: Upload Linux asset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(cat build/VERSION.txt)
          TAG="${{ env.TAG }}"
          gh release upload $TAG "APP/dist/Pydew Valley [v$VER] Linux.zip" --clobber
