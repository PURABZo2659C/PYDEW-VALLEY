name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag (e.g. v2.6)'
        required: true
        default: 'v2.6'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install --upgrade pip pygame numpy pytmx opencv-python pyinstaller pillow
      - name: Build Windows ZIP
        working-directory: APP
        run: |
          .\build.bat all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $ver = (Get-Content build\VERSION.txt -Raw).Trim()
          $source = "dist\Pydew Valley [v$ver] Windows.zip"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Windows ZIP was not created: $source"
          }
          Copy-Item -LiteralPath $source -Destination "dist\Pydew-Valley-v$ver-windows.zip"
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: APP/dist/Pydew-Valley-v*-windows.zip
          if-no-files-found: error
          retention-days: 1

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install --upgrade pip pygame numpy pytmx opencv-python pyinstaller pillow
      - name: Build macOS ZIP
        working-directory: APP
        run: |
          set -euo pipefail
          python build/make_version_info.py
          python build/make_icon.py
          python build/fix_line_endings.py
          python -m PyInstaller --clean --noconfirm PydewValley.spec
          VER=$(cat build/VERSION.txt)
          test -d "dist/PydewValley.app"
          zip -r "dist/Pydew-Valley-v${VER}-macos.zip" "dist/PydewValley.app"
      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: macos-package
          path: APP/dist/Pydew-Valley-v*-macos.zip
          if-no-files-found: error
          retention-days: 1

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Set up Python
        uses: actions/setup-python@v5.3.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev
          pip install --upgrade pip pygame numpy pytmx opencv-python pyinstaller pillow
      - name: Build Linux ZIP
        working-directory: APP
        run: |
          set -euo pipefail
          python build/make_version_info.py
          python build/make_icon.py
          python build/fix_line_endings.py
          python -m PyInstaller --clean --noconfirm PydewValley.spec
          VER=$(cat build/VERSION.txt)
          test -d "dist/PydewValley"
          zip -r "dist/Pydew-Valley-v${VER}-linux.zip" "dist/PydewValley"
      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: linux-package
          path: APP/dist/Pydew-Valley-v*-linux.zip
          if-no-files-found: error
          retention-days: 1

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - build-windows
      - build-macos
      - build-linux
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: release-assets
      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: macos-package
          path: release-assets
      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: linux-package
          path: release-assets
      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Updating release $RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "Pydew Valley $RELEASE_TAG" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
