name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Pydew Valley ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame numpy pytmx opencv-python pyinstaller

      - name: Build Windows
        working-directory: APP
        shell: cmd
        run: build.bat all

      - name: Upload Windows release asset
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content "APP/build/VERSION.txt" -Raw).Trim()
          $asset = "APP/dist/Pydew Valley [v$version] Windows.zip"

          if (-not (Test-Path -LiteralPath $asset)) {
            Write-Error "Windows build asset not found: $asset"
            Get-ChildItem -Path "APP/dist" -Force -ErrorAction SilentlyContinue
            exit 1
          }

          gh release upload "$env:RELEASE_TAG" "$asset" --clobber

  build-macos:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame numpy pytmx opencv-python pyinstaller

      - name: Build macOS app bundle
        working-directory: APP
        shell: bash
        run: |
          set -euo pipefail
          python build/make_version_info.py
          python build/make_icon.py
          python build/fix_line_endings.py
          python -m PyInstaller --clean --noconfirm PydewValley.spec

          version="$(tr -d '\r\n' < build/VERSION.txt)"
          app_path="dist/PydewValley.app"
          asset="dist/Pydew Valley [v${version}] macOS.zip"

          if [[ ! -d "$app_path" ]]; then
            echo "::error::Expected app bundle was not created: $app_path"
            ls -la dist || true
            exit 1
          fi

          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$asset"
          test -f "$asset"

      - name: Upload macOS release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < APP/build/VERSION.txt)"
          asset="APP/dist/Pydew Valley [v${version}] macOS.zip"
          test -f "$asset"
          gh release upload "$RELEASE_TAG" "$asset" --clobber

  build-linux:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install system and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip
          python -m pip install --upgrade pip
          python -m pip install pygame numpy pytmx opencv-python pyinstaller

      - name: Build Linux app directory
        working-directory: APP
        shell: bash
        run: |
          set -euo pipefail
          python build/make_version_info.py
          python build/make_icon.py
          python build/fix_line_endings.py
          python -m PyInstaller --clean --noconfirm PydewValley.spec

          version="$(tr -d '\r\n' < build/VERSION.txt)"
          app_path="dist/PydewValley"
          asset="dist/Pydew Valley [v${version}] Linux.zip"

          if [[ ! -d "$app_path" ]]; then
            echo "::error::Expected Linux app directory was not created: $app_path"
            ls -la dist || true
            exit 1
          fi

          zip -r "$asset" "$app_path"
          test -f "$asset"

      - name: Upload Linux release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < APP/build/VERSION.txt)"
          asset="APP/dist/Pydew Valley [v${version}] Linux.zip"
          test -f "$asset"
          gh release upload "$RELEASE_TAG" "$asset" --clobber
